name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # CPU torch keeps the job small. The rest are genuine import-time
      # dependencies: tests/test_fidelity.py exec's pipeline/paper_sweep.py,
      # which imports centroid_erasure, whose data loaders import `datasets`,
      # and whose models module imports `transformers`. Installing only
      # torch/numpy/sklearn/scipy makes every fidelity test fail at collection.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scikit-learn scipy pytest
          pip install transformers datasets Pillow huggingface_hub tqdm pandas

      - name: Verify the published pipeline still imports
        run: |
          python - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location("ps", "pipeline/paper_sweep.py")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert hasattr(mod, "KMeansCentroids") and hasattr(mod, "TextCDHook")
          print("pipeline/paper_sweep.py imports cleanly")
          PY

      - name: Verify the CLI is invokable
        run: |
          python main.py --help > /dev/null
          for c in fit measure tccd; do python main.py $c --help > /dev/null; done
          python demo/run_demo.py --help > /dev/null

      - name: Run CPU test suite
        run: pytest

      - name: Confirm no tracked source file is shadowed by a .gitignore rule
        run: |
          fail=0
          for f in $(git ls-files '*.py' '*.md' '*.txt' '*.sh' '*.yml'); do
            if git check-ignore -q "$f"; then
              echo "::error file=$f::tracked but matches a .gitignore rule"; fail=1
            fi
          done
          [ $fail -eq 0 ] && echo "no tracked file is shadowed by an ignore rule"
          exit $fail
