name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10.20"

      # CPU torch keeps the job small. Use the paper's exact package versions;
      # an unpinned CI environment can pass while the documented environment is
      # uninstallable or API-incompatible.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install \
            transformers==5.4.0 accelerate==1.13.0 numpy==2.2.6 \
            scikit-learn==1.7.2 scipy==1.15.3 datasets==4.8.4 \
            Pillow==12.1.1 qwen-vl-utils==0.0.14 tqdm==4.67.3 \
            huggingface-hub==1.8.0 pandas==2.3.3 pytest==9.1.1
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Verify the published pipeline still imports
        run: |
          python - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location("ps", "pipeline/paper_sweep.py")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert hasattr(mod, "KMeansCentroids") and hasattr(mod, "TextCDHook")
          print("pipeline/paper_sweep.py imports cleanly")
          PY

      - name: Verify the CLI is invokable
        run: |
          python main.py --help > /dev/null
          for c in fit measure tccd; do python main.py $c --help > /dev/null; done
          python demo/run_demo.py --help > /dev/null

      - name: Build and inspect the distributable
        run: |
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
          python setup.py check

      - name: Run CPU test suite
        run: pytest

      - name: Confirm no tracked source file is shadowed by a .gitignore rule
        run: |
          fail=0
          for f in $(git ls-files '*.py' '*.md' '*.txt' '*.sh' '*.yml'); do
            if git check-ignore --no-index -q "$f"; then
              echo "::error file=$f::tracked but matches a .gitignore rule"; fail=1
            fi
          done
          [ $fail -eq 0 ] && echo "no tracked file is shadowed by an ignore rule"
          exit $fail
