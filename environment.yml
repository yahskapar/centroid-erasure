name: centroid-erasure
channels: [pytorch, nvidia, conda-forge]
dependencies:
  - python=3.10.20
  - pip
  - pip:
      # The index must be its own entry; appending it to a requirement line
      # is silently ignored and torch is then fetched from PyPI without CUDA.
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0+cu124
      - torchvision==0.21.0+cu124
      - transformers==5.4.0
      - accelerate==1.13.0
      - numpy==2.2.6
      - scikit-learn==1.7.2
      - scipy==1.15.3
      - datasets==4.8.4
      - Pillow==12.1.1
      - qwen-vl-utils==0.0.14
      - tqdm==4.67.3
      - huggingface-hub==1.8.0
      - pandas==2.3.3
      # Required for supplementary statistical analyses.
      - statsmodels==0.14.2
      - bitsandbytes==0.49.2
      - -e .
